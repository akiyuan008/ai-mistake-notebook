<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>简错题 · AI 智能错题本</title>
<meta name="description" content="简洁高级的 AI 智能错题本：内置相机连拍、八点透视裁剪、拼接、图像增强、AI 解析、错题库、智能组卷打印、学习统计。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230EA5E9'/%3E%3Cpath fill='%23fff' d='M68 22H36c-3 0-5.5 2.5-5.5 5.5v45c0 3 2.5 5.5 5.5 5.5h32c3 0 5.5-2.5 5.5-5.5v-45c0-3-2.5-5.5-5.5-5.5zM36 27.5h14v22l-7-4.2-7 4.2v-22z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --ink:#0C2B42; --ink2:#3E5F78; --ink3:#8AA6BA;
  --accent:#0EA5E9; --accent-deep:#0284C7; --accent-ink:#0369A1;
  --accent-soft:rgba(14,165,233,.12);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.85);
  --glass-border:rgba(255,255,255,.8);
  --green:#10B981; --green-soft:rgba(16,185,129,.12);
  --amber:#F59E0B; --amber-soft:rgba(245,158,11,.14);
  --red:#F43F5E; --red-soft:rgba(244,63,94,.1);
  --radius:16px; --radius-lg:22px;
  --shadow:0 2px 10px rgba(12,72,120,.06),0 10px 30px rgba(12,72,120,.08);
  --shadow-lg:0 16px 50px rgba(12,72,120,.2);
  --blur:blur(20px) saturate(1.5);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh;
  background:linear-gradient(165deg,#EAF6FF 0%,#D8ECFC 40%,#E2F1FE 75%,#F0F8FF 100%);background-attachment:fixed}
body::before{content:"";position:fixed;top:-160px;right:-120px;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.35),transparent 65%);pointer-events:none;z-index:0}
body::after{content:"";position:fixed;bottom:-180px;left:-100px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(14,165,233,.22),transparent 65%);pointer-events:none;z-index:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);outline:none}
img{display:block;max-width:100%}
a{color:var(--accent-deep);text-decoration:none}
::selection{background:rgba(14,165,233,.2)}
::placeholder{color:#A7C0D2;opacity:1}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(14,165,233,.28);border-radius:8px}

.app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:236px;position:fixed;top:14px;bottom:14px;left:14px;border-radius:var(--radius-lg);
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:40;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 16px}
.brand-logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#38BDF8,#0284C7);
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px rgba(2,132,199,.35)}
.brand-name{font-size:16.5px;font-weight:800;letter-spacing:.5px}
.brand-sub{font-size:10.5px;color:var(--ink3);letter-spacing:1.5px;margin-top:1px}
.nav{padding:4px 12px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;color:var(--ink2);
  font-weight:600;margin-bottom:3px;transition:.18s;cursor:pointer;user-select:none;font-size:13.5px}
.nav-item svg{flex:none;opacity:.8}
.nav-item:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.nav-item.active{background:linear-gradient(135deg,rgba(14,165,233,.16),rgba(56,189,248,.1));
  color:var(--accent-ink);box-shadow:inset 0 0 0 1px rgba(14,165,233,.18)}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;min-width:18px;height:18px;
  border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.6);font-size:11.5px;color:var(--ink3);line-height:1.7}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.main{flex:1;margin-left:264px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;padding:16px 30px 12px;display:flex;align-items:center;gap:12px}
.topbar-glass{flex:1;display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:16px;padding:11px 20px;box-shadow:var(--shadow)}
.topbar h1{font-size:17px;font-weight:800}
.topbar-sub{font-size:12px;color:var(--ink3)}
.content{padding:14px 30px 100px;max-width:1240px;width:100%}
.mobile-tabbar{display:none}

.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 18px;border-radius:12px;
  font-weight:700;transition:.16s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#38BDF8,#0284C7);color:#fff;box-shadow:0 6px 18px rgba(2,132,199,.32)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{filter:grayscale(.4) opacity(.6);cursor:not-allowed}
.btn-ghost{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);color:var(--ink2);backdrop-filter:blur(8px)}
.btn-ghost:hover{background:rgba(255,255,255,.85);color:var(--ink)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{padding:6px 13px;font-size:13px;border-radius:10px}
.btn-lg{padding:13px 26px;font-size:15px;border-radius:14px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
  cursor:pointer;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.5);color:var(--ink2);transition:.16s;user-select:none}
.chip:hover{background:rgba(255,255,255,.8)}
.chip.on{background:linear-gradient(135deg,#38BDF8,#0284C7);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(2,132,199,.3)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.input,.textarea,.select{width:100%;border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:10px 13px;
  background:rgba(255,255,255,.65);transition:.16s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.16);background:rgba(255,255,255,.9)}
.textarea{resize:vertical;min-height:72px;line-height:1.6}
.empty{text-align:center;padding:52px 20px;color:var(--ink3)}
.empty svg{margin:0 auto 14px;opacity:.45}
.empty-title{font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.divider{height:1px;background:rgba(255,255,255,.7);margin:14px 0}

/* 统计 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat-card{padding:20px}
.stat-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.stat-value{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.stat-label{font-size:12.5px;color:var(--ink3);margin-top:4px}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.panel-title{font-size:15px;font-weight:800;padding:18px 20px 0;display:flex;align-items:center;gap:8px}
.panel-title .hint{font-size:12px;font-weight:400;color:var(--ink3);margin-left:auto}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar-label{width:52px;font-size:13px;font-weight:700;color:var(--ink2);flex:none}
.bar-track{flex:1;height:10px;background:rgba(14,165,233,.1);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#38BDF8,#0284C7);transition:width .6s cubic-bezier(.22,1,.36,1)}
.bar-num{width:34px;text-align:right;font-size:12.5px;color:var(--ink3);flex:none}
.kp-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.6)}
.kp-item:last-child{border-bottom:none}
.kp-rank{width:22px;height:22px;border-radius:8px;background:rgba(14,165,233,.12);color:var(--accent-ink);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.kp-rank.top{background:var(--amber-soft);color:#B45309}

/* 提取入口 */
.entry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.entry-card{padding:26px 20px;text-align:center;cursor:pointer;transition:.2s}
.entry-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.entry-icon{width:54px;height:54px;border-radius:17px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.entry-title{font-size:15px;font-weight:800;margin-bottom:3px}
.entry-sub{font-size:12px;color:var(--ink3)}

/* 相机 */
.camera-mask{position:fixed;inset:0;background:#000;z-index:120;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.25s}
.camera-mask.show{opacity:1;pointer-events:auto}
.cam-top{display:flex;align-items:center;padding:14px 16px;color:#fff;gap:12px;z-index:2}
.cam-top .title{flex:1;text-align:center;font-weight:700;font-size:15px}
.cam-view{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam-view video{width:100%;height:100%;object-fit:cover}
.cam-guide{position:absolute;inset:8% 5% 12% 5%;border:1.5px dashed rgba(255,255,255,.55);border-radius:14px;pointer-events:none}
.cam-guide span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11.5px;color:rgba(255,255,255,.75);white-space:nowrap;background:rgba(0,0,0,.35);padding:2px 10px;border-radius:999px}
.cam-bottom{padding:10px 20px calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:18px;color:#fff;z-index:2}
.cam-strip{display:flex;gap:8px;overflow-x:auto;padding:0 20px 8px;z-index:2}
.cam-strip img{width:52px;height:68px;object-fit:cover;border-radius:8px;border:2px solid rgba(255,255,255,.5);flex:none}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.35);flex:none;margin:0 auto;transition:.12s;box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.shutter:active{transform:scale(.9)}
.cam-side{flex:1;display:flex;justify-content:center}
.cam-btn{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;color:#fff;border:1px solid rgba(255,255,255,.2)}
.cam-count{position:absolute;top:-6px;right:-6px;background:var(--accent);min-width:19px;height:19px;border-radius:10px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* 相册 */
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.album-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:#E8F1F8}

/* 裁剪工作台 */
.viewer-wrap{position:relative;background:#2A3340;border-radius:var(--radius);overflow:hidden;user-select:none;touch-action:none;
  box-shadow:inset 0 0 30px rgba(0,0,0,.2)}
.viewer-wrap>img{width:100%;pointer-events:none}
.viewer-toolbar{background:rgba(42,51,64,.95);backdrop-filter:blur(10px)}
.viewer-toolbar *{color:#E8F1F8}
.viewer-toolbar .btn-ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#E8F1F8}
.viewer-toolbar .btn-ghost:hover{background:rgba(255,255,255,.16)}
.viewer-toolbar .btn-primary{background:linear-gradient(135deg,#38BDF8,#0284C7);color:#fff}
.quad{position:absolute;cursor:move}
.quad svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.quad .h{position:absolute;width:15px;height:15px;background:#0EA5E9;border:2.5px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(2,132,199,.45);pointer-events:auto}
.quad .h.edge{width:17px;height:9px;border-radius:5px}
.quad-menu{position:absolute;display:flex;gap:6px;z-index:5}
.quad-menu button{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800;box-shadow:0 3px 10px rgba(12,43,66,.25);display:flex;align-items:center;gap:4px}
.qm-extract{background:var(--green);color:#fff}
.qm-stitch{background:#F59E0B;color:#fff}
.qm-stitch.grouping{background:#7C3AED}
.qm-del{background:var(--red);color:#fff;width:24px;padding:4px 0;justify-content:center}
.qm-cancel{background:rgba(255,255,255,.92);color:var(--ink2)}
.stitch-badge{position:absolute;top:-24px;left:-2px;background:#7C3AED;color:#fff;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px}
.viewer-toolbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.7);flex-wrap:wrap}
.thumb-strip{display:flex;gap:10px;overflow-x:auto;padding:14px;background:#1E2732;border-radius:0 0 var(--radius) var(--radius)}
.thumb{width:84px;flex:none;cursor:pointer;position:relative}
.thumb img{width:84px;height:110px;object-fit:cover;border-radius:10px;border:2.5px solid transparent;background:#3A4555;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.thumb.on img{border-color:#38BDF8;box-shadow:0 0 0 3px rgba(56,189,248,.3)}
.thumb .tdel{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#F43F5E;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}
.thumb:hover .tdel{opacity:1}
.thumb-page{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:1px 6px;border-radius:5px}
.queue-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.6);align-items:center}
.queue-item:last-child{border-bottom:none}
.queue-thumb{width:52px;height:52px;object-fit:cover;border-radius:9px;background:#E8F1F8;flex:none}
.queue-status{font-size:11px;font-weight:800;padding:2.5px 9px;border-radius:999px;white-space:nowrap}
.st-wait{background:rgba(255,255,255,.7);color:var(--ink2)}
.st-doing{background:rgba(14,165,233,.14);color:var(--accent-ink)}
.st-done{background:var(--green-soft);color:#059669}
.st-fail{background:var(--red-soft);color:var(--red)}
.import-grid{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}

/* 错题库列表 */
.lib-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-box{position:relative;flex:1;min-width:220px;max-width:380px}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.search-box input{width:100%;padding-left:38px}
.seg{display:inline-flex;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);border-radius:12px;padding:3px}
.seg button{padding:6px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:linear-gradient(135deg,#38BDF8,#0284C7);color:#fff;box-shadow:0 3px 8px rgba(2,132,199,.28)}
.m-row{display:flex;gap:13px;padding:14px 16px;cursor:pointer;transition:.16s;align-items:center;margin-bottom:10px}
.m-row:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.m-row-img{width:86px;height:86px;border-radius:11px;object-fit:cover;background:#E8F1F8;flex:none}
.m-row-img.none{display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.m-row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.m-row-q{font-size:13.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m-row-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.mastered-ribbon{position:absolute;top:10px;right:10px;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}

/* 组卷 */
.compose-cond{padding:20px}
.cond-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-action{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:15px;margin-bottom:12px;
  background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);transition:.18s;text-align:left}
.big-action:hover{background:rgba(255,255,255,.9);transform:translateY(-1px)}
.big-action .ba-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.big-action .ba-title{font-size:15px;font-weight:800}
.big-action .ba-sub{font-size:12px;color:var(--ink3)}
.q-pick{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.6);cursor:pointer;align-items:flex-start;transition:.12s}
.q-pick:hover{background:rgba(255,255,255,.5)}
.q-pick input{margin-top:4px;accent-color:var(--accent);width:15px;height:15px;flex:none}
.q-pick img{width:56px;height:56px;object-fit:cover;border-radius:9px;background:#E8F1F8;flex:none}
.paper-sheet{background:#fff;border-radius:8px;box-shadow:var(--shadow-lg);padding:52px 48px;max-width:760px;margin:0 auto;min-height:500px;color:#111}
.paper-sheet h2{text-align:center;font-size:22px;letter-spacing:3px;margin-bottom:4px}
.paper-sub{text-align:center;font-size:12px;color:#999;margin-bottom:14px}
.paper-info{display:flex;justify-content:space-between;font-size:13px;color:#444;border-bottom:1px solid #ddd;padding-bottom:12px;margin-bottom:22px}
.paper-info span b{font-weight:400}
.paper-q{margin-bottom:24px;page-break-inside:avoid}
.paper-q .q-title{font-weight:700;margin-bottom:8px;font-size:14.5px}
.paper-q img{max-width:88%;border:1px solid #ddd;border-radius:4px;margin:6px 0}
.answer-area{margin-top:10px;border:1px dashed #bbb;border-radius:8px;padding:10px 12px;color:#aaa;font-size:12.5px;min-height:44px}
.paper-a{margin-top:10px;padding:10px 12px;background:#F3F8FC;border-radius:8px;font-size:13px;color:#333;page-break-inside:avoid}

/* 模态 / Toast */
.modal-mask{position:fixed;inset:0;background:rgba(12,43,66,.4);backdrop-filter:blur(4px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{background:rgba(255,255,255,.93);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.9);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:640px;max-height:88vh;
  display:flex;flex-direction:column;transform:translateY(12px) scale(.98);transition:.22s}
.modal-mask.show .modal{transform:none}
.modal.wide{max-width:860px}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid rgba(14,165,233,.1)}
.modal-head h3{font-size:16px;font-weight:800;flex:1}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid rgba(14,165,233,.1);display:flex;justify-content:flex-end;gap:10px}
.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:rgba(12,43,66,.9);backdrop-filter:blur(10px);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .25s cubic-bezier(.22,1,.36,1);display:flex;gap:8px;align-items:center}

.detail-img{border-radius:12px;border:1px solid rgba(255,255,255,.9);max-height:340px;object-fit:contain;width:100%;background:#EFF6FB}
.section-block{border:1px solid rgba(255,255,255,.9);border-radius:13px;padding:14px 16px;margin-bottom:12px;background:rgba(255,255,255,.55)}
.section-block h4{font-size:12.5px;font-weight:800;color:var(--ink3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.section-block .body{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}

@media (max-width:1080px){
  .import-grid,.two-col{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{padding:12px 14px 8px}
  .content{padding:10px 14px 110px}
  .mobile-tabbar{display:flex;position:fixed;bottom:10px;left:10px;right:10px;align-items:center;
    background:rgba(255,255,255,.75);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-border);border-radius:24px;z-index:50;padding:7px 10px;box-shadow:var(--shadow-lg)}
  .mtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;border-radius:14px;color:var(--ink3);font-size:10.5px;font-weight:700}
  .mtab.on{color:var(--accent-ink);background:var(--accent-soft)}
  .mtab-center{flex:none;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#38BDF8,#0284C7);
    color:#fff;display:flex;align-items:center;justify-content:center;margin:0 6px -14px;box-shadow:0 8px 20px rgba(2,132,199,.4);border:3px solid #fff}
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .modal{max-height:92vh}
}
@media print{
  body *{visibility:hidden}
  .paper-sheet,.paper-sheet *{visibility:visible}
  .paper-sheet{position:absolute;left:0;top:0;width:100%;box-shadow:none;border-radius:0;padding:24px 30px}
  .modal-mask{position:static;background:none;padding:0;backdrop-filter:none}
  .modal{max-height:none;box-shadow:none;max-width:none}
}

/* ---------- IndexedDB ---------- */
const DB={
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const req=indexedDB.open("jct-cuoti",2);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains("mistakes"))db.createObjectStore("mistakes",{keyPath:"id"});
        if(!db.objectStoreNames.contains("papers"))db.createObjectStore("papers",{keyPath:"id"});
        if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv",{keyPath:"k"});
      };
      req.onsuccess=e=>{DB.db=e.target.result;res()};
      req.onerror=()=>rej(req.error);
    });
  },
  tx(store,mode="readonly"){return DB.db.transaction(store,mode).objectStore(store)},
  put(store,val){return new Promise((res,rej)=>{const r=DB.tx(store,"readwrite").put(val);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  del(store,key){return new Promise((res,rej)=>{const r=DB.tx(store,"readwrite").delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  get(store,key){return new Promise((res,rej)=>{const r=DB.tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  all(store){return new Promise((res,rej)=>{const r=DB.tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  clear(store){return new Promise((res,rej)=>{const r=DB.tx(store,"readwrite").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
};

/* ---------- Supabase ---------- */
const SUPA={url:"",key:"",on(){return !!(this.url&&this.key)}};
async function supaFetch(path,opt={}){
  const resp=await fetch(SUPA.url.replace(/\/$/,"")+"/rest/v1/"+path,{
    ...opt,headers:{
      "apikey":SUPA.key,"Authorization":"Bearer "+SUPA.key,
      "Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal",
      ...(opt.headers||{})
    }
  });
  if(!resp.ok)throw new Error("云端返回 "+resp.status);
  return resp;
}
const cloud={
  async pushMistake(m){
    if(!SUPA.on())return;
    try{await supaFetch("mistakes",{method:"POST",body:JSON.stringify({
      id:m.id,subject:m.subject,knowledge:m.knowledge||"",topic:m.topic||"",
      question:m.question||"",answer:m.answer||"",analysis:m.analysis||"",
      image:m.image||"",error_count:m.errorCount||1,mastered:!!m.mastered,
      parsed_by:m.parsedBy||"",created_at:new Date(m.createdAt).toISOString(),
      updated_at:new Date(m.updatedAt||Date.now()).toISOString()
    })});}catch(e){console.warn("cloud push fail",e)}
  },
  async delMistake(id){if(!SUPA.on())return;try{await supaFetch("mistakes?id=eq."+encodeURIComponent(id),{method:"DELETE"});}catch(e){console.warn(e)}},
  async pushPaper(p){
    if(!SUPA.on())return;
    try{await supaFetch("papers",{method:"POST",body:JSON.stringify({
      id:p.id,type:p.type,name:p.name,subjects:p.subjects||"",count:p.count||0,
      questions:p.questions||[],created_at:new Date(p.createdAt).toISOString()
    })});}catch(e){console.warn(e)}
  },
  async delPaper(id){if(!SUPA.on())return;try{await supaFetch("papers?id=eq."+encodeURIComponent(id),{method:"DELETE"});}catch(e){console.warn(e)}},
  async pull(){
    if(!SUPA.on())return;
    try{
      const r=await supaFetch("mistakes?select=*",{headers:{Prefer:"return=representation"}});
      const rows=await r.json();
      if(!Array.isArray(rows))return;
      const local=new Map(state.mistakes.map(m=>[m.id,m]));
      let merged=0;
      for(const row of rows){
        const lm=local.get(row.id);
        const rt=new Date(row.updated_at||0).getTime();
        if(!lm||(lm.updatedAt||lm.createdAt||0)<rt){
          await DB.put("mistakes",{
            id:row.id,subject:row.subject,knowledge:row.knowledge||"",topic:row.topic||"",
            question:row.question||"",answer:row.answer||"",analysis:row.analysis||"",
            image:row.image||"",errorCount:row.error_count||1,mastered:!!row.mastered,
            parsedBy:row.parsed_by||"cloud",createdAt:new Date(row.created_at).getTime(),
            updatedAt:new Date(row.updated_at).getTime()
          });
          merged++;
        }
      }
      if(merged>0){await loadAll();toast(`云端同步：合并 ${merged} 条错题`,"ok")}
    }catch(e){console.warn("cloud pull fail",e)}
  }
};

async function openCamera(){
  const mask=$("#cameraMask");
  mask.classList.add("show");
  state.cam.shots=[];renderCamStrip();
  const video=$("#camVideo");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    state.cam.stream=stream;
    video.srcObject=stream;
    await video.play().catch(()=>{});
    const track=stream.getVideoTracks()[0];
    const caps=track.getCapabilities?track.getCapabilities():{};
    $("#camTorch").style.visibility=caps.torch?"visible":"hidden";
  }catch(e){
    toast("相机打开失败："+(e.message||"请检查权限"),"err");
    closeCamera();
  }
}
function closeCamera(){
  const mask=$("#cameraMask");
  mask.classList.remove("show");
  if(state.cam.stream){
    state.cam.stream.getTracks().forEach(t=>t.stop());
    state.cam.stream=null;
  }
  $("#camVideo").srcObject=null;
}
function renderCamStrip(){
  const strip=$("#camStrip");
  strip.innerHTML=state.cam.shots.map((s,i)=>`<img src="${s.thumb||s.src}" data-shot="${i}">`).join("");
  const done=$("#camDone");
  done.textContent=state.cam.shots.length?`完成 (${state.cam.shots.length})`:"完成";
}
function captureShot(){
  const video=$("#camVideo");
  if(!video.videoWidth){toast("相机未就绪","err");return}
  const c=document.createElement("canvas");
  c.width=video.videoWidth;c.height=video.videoHeight;
  c.getContext("2d").drawImage(video,0,0);
  const src=c.toDataURL("image/jpeg",0.9);
  const tc=document.createElement("canvas");
  const s=160/Math.max(c.width,c.height);
  tc.width=c.width*s;tc.height=c.height*s;
  tc.getContext("2d").drawImage(c,0,0,tc.width,tc.height);
  state.cam.shots.push({src,thumb:tc.toDataURL("image/jpeg",0.6)});
  renderCamStrip();
  const mask=$("#cameraMask");
  mask.style.transition="none";mask.style.opacity=".55";
  setTimeout(()=>{mask.style.transition=".25s";mask.style.opacity="1"},80);
}
$("#shutterBtn").addEventListener("click",captureShot);

/* ============================================================
 * 八点透视框选
 * ============================================================ */
function defaultQuad(){
  return {pts:[{x:8,y:8},{x:92,y:8},{x:92,y:42},{x:8,y:42}],group:0};
}
function quadCenter(q){
  return {x:(q.pts[0].x+q.pts[1].x+q.pts[2].x+q.pts[3].x)/4,
          y:(q.pts[0].y+q.pts[1].y+q.pts[2].y+q.pts[3].y)/4};
}
function initQuads(wrap){
  drawQuads(wrap);
  let drag=null;
  const pos=e=>{
    const r=wrap.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:Math.max(0,Math.min(100,(t.clientX-r.left)/r.width*100)),
            y:Math.max(0,Math.min(100,(t.clientY-r.top)/r.height*100))};
  };
  wrap.addEventListener("mousedown",e=>{
    const h=e.target.closest("[data-handle]");
    if(h){
      const qi=+h.closest(".quad").dataset.qi;
      drag={mode:h.dataset.handle,qi,idx:+h.dataset.idx,sx:pos(e).x,sy:pos(e).y,
        orig:JSON.parse(JSON.stringify(state.work.quads[qi].pts))};
      e.preventDefault();return;
    }
    const body=e.target.closest(".quad");
    if(body){
      const qi=+body.dataset.qi;
      drag={mode:"move",qi,sx:pos(e).x,sy:pos(e).y,
        orig:JSON.parse(JSON.stringify(state.work.quads[qi].pts))};
      e.preventDefault();
    }
  });
  const move=e=>{
    if(!drag)return;e.preventDefault();
    const p=pos(e);const dx=p.x-drag.sx,dy=p.y-drag.sy;
    const q=state.work.quads[drag.qi];if(!q){drag=null;return}
    if(drag.mode==="move"){
      q.pts=drag.orig.map(pt=>({x:Math.max(0,Math.min(100,pt.x+dx)),y:Math.max(0,Math.min(100,pt.y+dy))}));
    }else if(drag.mode==="corner"){
      q.pts[drag.idx]={x:p.x,y:p.y};
    }else if(drag.mode==="edge"){
      const [a,b]=[[0,1],[1,2],[2,3],[3,0]][drag.idx];
      const o=drag.orig;
      const na={x:Math.max(0,Math.min(100,o[a].x+dx)),y:Math.max(0,Math.min(100,o[a].y+dy))};
      const nb={x:Math.max(0,Math.min(100,o[b].x+dx)),y:Math.max(0,Math.min(100,o[b].y+dy))};
      q.pts[a]=na;q.pts[b]=nb;
    }
    drawQuads(wrap);
  };
  const up=()=>{drag=null};
  window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
  wrap.addEventListener("touchstart",e=>{
    const h=e.target.closest("[data-handle]");
    if(h){
      const qi=+h.closest(".quad").dataset.qi;
      drag={mode:h.dataset.handle,qi,idx:+h.dataset.idx,sx:pos(e).x,sy:pos(e).y,
        orig:JSON.parse(JSON.stringify(state.work.quads[qi].pts))};
      e.preventDefault();return;
    }
    const body=e.target.closest(".quad");
    if(body){
      const qi=+body.dataset.qi;
      drag={mode:"move",qi,sx:pos(e).x,sy:pos(e).y,
        orig:JSON.parse(JSON.stringify(state.work.quads[qi].pts))};
      e.preventDefault();
    }
  },{passive:false});
  wrap.addEventListener("touchmove",move,{passive:false});
  wrap.addEventListener("touchend",up);
}
const GROUP_COLORS=["#7C3AED","#DB2777","#0D9488","#B45309"];
function drawQuads(wrap){
  wrap.querySelectorAll(".quad,.quad-menu").forEach(el=>el.remove());
  const w=state.work;
  w.quads.forEach((q,qi)=>{
    const el=document.createElement("div");
    el.className="quad";el.dataset.qi=qi;
    el.style.cssText="position:absolute;inset:0";
    const p=q.pts;
    const gc=q.group?GROUP_COLORS[(q.group-1)%GROUP_COLORS.length]:"#38BDF8";
    const poly=`${p[0].x},${p[0].y} ${p[1].x},${p[1].y} ${p[2].x},${p[2].y} ${p[3].x},${p[3].y}`;
    let handles="";
    p.forEach((pt,i)=>{handles+=`<div class="h" data-handle="corner" data-idx="${i}" style="left:${pt.x}%;top:${pt.y}%"></div>`});
    for(let i=0;i<4;i++){
      const a=p[i],b=p[(i+1)%4];
      handles+=`<div class="h edge" data-handle="edge" data-idx="${i}" style="left:${(a.x+b.x)/2}%;top:${(a.y+b.y)/2}%"></div>`;
    }
    el.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <polygon points="${poly}" fill="${gc}14" stroke="${gc}" stroke-width="0.6" vector-effect="non-scaling-stroke" style="stroke-width:2px"/></svg>
      ${q.group?`<span class="stitch-badge" style="left:${Math.min(...p.map(x=>x.x))}%;top:${Math.min(...p.map(x=>x.y))}%;position:absolute">拼接 ${q.group}</span>`:""}
      ${handles}`;
    wrap.appendChild(el);
    const c=quadCenter(q);
    const menu=document.createElement("div");
    menu.className="quad-menu";
    menu.style.cssText=`left:${c.x}%;top:${Math.min(...p.map(x=>x.y))}%;transform:translate(-50%,-130%)`;
    menu.innerHTML=state.work.stitchMode
      ?`<button class="qm-stitch ${w.stitchGroup.includes(qi)?"grouping":""}" data-st="${qi}">${w.stitchGroup.includes(qi)?ICONS.check:ICONS.stitch} ${w.stitchGroup.includes(qi)?"已选":"拼接"}</button>
        <button class="qm-cancel" data-stc="1">取消</button>`
      :`<button class="qm-extract" data-ex="${qi}">${ICONS.cut} 提取</button>
        <button class="qm-stitch" data-stm="${qi}">${ICONS.stitch} 拼接</button>
        <button class="qm-del" data-qd="${qi}">×</button>`;
    wrap.appendChild(menu);
  });
  $$(".quad-menu [data-ex]").forEach(b=>b.onclick=e=>{e.stopPropagation();extractQuads([+b.dataset.ex])});
  $$(".quad-menu [data-qd]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    w.quads.splice(+b.dataset.qd,1);
    drawQuads(wrap);updateExtractBtn();
  });
  $$(".quad-menu [data-stm]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    w.stitchMode=true;w.stitchGroup=[+b.dataset.stm];
    drawQuads(wrap);renderImportToolbar();
  });
  $$(".quad-menu [data-st]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const i=+b.dataset.st;
    const at=w.stitchGroup.indexOf(i);
    if(at>-1){w.stitchGroup.splice(at,1)}else w.stitchGroup.push(i);
    if(w.stitchGroup.length<1)w.stitchGroup.push(i);
    drawQuads(wrap);renderImportToolbar();
  });
  $$(".quad-menu [data-stc]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    w.stitchMode=false;w.stitchGroup=[];
    drawQuads(wrap);renderImportToolbar();
  });
}
function renderImportToolbar(){
  const w=state.work;
  const old=$("#stitchDone");if(old)old.remove();
  if(w.stitchMode){
    const tb=$(".viewer-toolbar");
    if(tb){
      const btn=document.createElement("span");
      btn.className="btn btn-sm";btn.id="stitchDone";
      btn.style.cssText="background:#7C3AED;color:#fff";
      btn.textContent=`完成拼接 (${w.stitchGroup.length})`;
      btn.onclick=()=>finishStitch();
      tb.insertBefore(btn,tb.lastElementChild);
    }
  }
}
function finishStitch(){
  const w=state.work;
  if(w.stitchGroup.length>=2){
    const gid=(Math.max(0,...w.quads.map(q=>q.group||0)))+1;
    w.stitchGroup.forEach(i=>{if(w.quads[i])w.quads[i].group=gid});
    toast(`已标记 ${w.stitchGroup.length} 个选区为拼接组 ${gid}`,"ok");
  }else if(w.stitchGroup.length===1){
    toast("拼接至少需要选择 2 个选区","err");
  }
  w.stitchMode=false;w.stitchGroup=[];
  const wrap=$("#viewerWrap");
  if(wrap)drawQuads(wrap);
  renderImportToolbar();
}

/* ============================================================
 * 透视裁剪（单应性变换）+ 扫描增强
 * ============================================================ */
function solveHomography(srcPts,dstPts){
  // 解 8x8 线性方程组：dst -> src 的映射
  const A=[],B=[];
  for(let i=0;i<4;i++){
    const [x,y]=[dstPts[i].x,dstPts[i].y],[X,Y]=[srcPts[i].x,srcPts[i].y];
    A.push([x,y,1,0,0,0,-x*X,-y*X]);B.push(X);
    A.push([0,0,0,x,y,1,-x*Y,-y*Y]);B.push(Y);
  }
  const n=8;
  for(let col=0;col<n;col++){
    let piv=col;
    for(let r=col+1;r<n;r++)if(Math.abs(A[r][col])>Math.abs(A[piv][col]))piv=r;
    [A[col],A[piv]]=[A[piv],A[col]];[B[col],B[piv]]=[B[piv],B[col]];
    if(Math.abs(A[col][col])<1e-12)return null;
    for(let r=0;r<n;r++){
      if(r===col)continue;
      const f=A[r][col]/A[col][col];
      for(let c=col;c<n;c++)A[r][c]-=f*A[col][c];
      B[r]-=f*B[col];
    }
  }
  const h=B.map((b,i)=>b/A[i][i]);
  return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7]];
}
function warpPerspective(img,srcQuad,outW,outH){
  const c=document.createElement("canvas");
  c.width=outW;c.height=outH;
  const ctx=c.getContext("2d");
  ctx.drawImage(img,0,0);
  const srcData=ctx.getImageData(0,0,img.width,img.height);
  const out=ctx.createImageData(outW,outH);
  const dstPts=[{x:0,y:0},{x:outW,y:0},{x:outW,y:outH},{x:0,y:outH}];
  const H=solveHomography(srcQuad,dstPts);
  const sw=img.width,sh=img.height,d=srcData.data,o=out.data;
  if(!H){
    // 降级：包围盒裁剪
    const xs=srcQuad.map(p=>p.x),ys=srcQuad.map(p=>p.y);
    const x0=Math.max(0,Math.min(...xs)),y0=Math.max(0,Math.min(...ys));
    const x1=Math.min(sw,Math.max(...xs)),y1=Math.min(sh,Math.max(...ys));
    const c2=document.createElement("canvas");
    c2.width=Math.max(2,x1-x0);c2.height=Math.max(2,y1-y0);
    c2.getContext("2d").drawImage(img,x0,y0,c2.width,c2.height,0,0,c2.width,c2.height);
    return c2;
  }
  const [h1,h2,h3,h4,h5,h6,h7,h8]=H;
  for(let y=0;y<outH;y++){
    for(let x=0;x<outW;x++){
      const den=h7*x+h8*y+1;
      const sx=(h1*x+h2*y+h3)/den;
      const sy=(h4*x+h5*y+h6)/den;
      const oi=(y*outW+x)*4;
      if(sx<0||sy<0||sx>sw-1||sy>sh-1){o[oi+3]=0;continue}
      const x0=Math.floor(sx),y0=Math.floor(sy);
      const fx=sx-x0,fy=sy-y0;
      const i00=(y0*sw+x0)*4,i10=i00+4,i01=i00+sw*4,i11=i01+4;
      for(let ch=0;ch<3;ch++){
        const v=(d[i00+ch]*(1-fx)+d[i10+ch]*fx)*(1-fy)+(d[i01+ch]*(1-fx)+d[i11+ch]*fx)*fy;
        o[oi+ch]=v;
      }
      o[oi+3]=255;
    }
  }
  const c3=document.createElement("canvas");
  c3.width=outW;c3.height=outH;
  c3.getContext("2d").putImageData(out,0,0);
  return c3;
}
function enhanceImage(canvas){
  // 扫描仪式增强：估计光照背景 -> 归一化去阴影 -> 提对比
  const ctx=canvas.getContext("2d");
  const w=canvas.width,h=canvas.height;
  const img=ctx.getImageData(0,0,w,h);
  const d=img.data;
  // 1) 低分辨率背景光照估计（16x16 网格）
  const GN=16;
  const grid=new Float32Array(GN*GN*3);
  const cnt=new Float32Array(GN*GN);
  const stepX=w/GN,stepY=h/GN;
  for(let y=0;y<h;y+=Math.max(1,Math.floor(h/64))){
    for(let x=0;x<w;x+=Math.max(1,Math.floor(w/64))){
      const gi=Math.min(GN-1,Math.floor(y/stepY))*GN+Math.min(GN-1,Math.floor(x/stepX));
      const i=(y*w+x)*4;
      grid[gi*3]+=d[i];grid[gi*3+1]+=d[i+1];grid[gi*3+2]+=d[i+2];cnt[gi]++;
    }
  }
  for(let i=0;i<GN*GN;i++){
    if(cnt[i]>0){grid[i*3]/=cnt[i];grid[i*3+1]/=cnt[i];grid[i*3+2]/=cnt[i]}
    else{grid[i*3]=grid[i*3+1]=grid[i*3+2]=255}
  }
  const bgAt=(x,y)=>{
    const gx=Math.min(GN-1.001,x/w*GN),gy=Math.min(GN-1.001,y/h*GN);
    const x0=Math.floor(gx),y0=Math.floor(gy);
    const x1=Math.min(GN-1,x0+1),y1=Math.min(GN-1,y0+1);
    const fx=gx-x0,fy=gy-y0;
    const out=[0,0,0];
    for(let ch=0;ch<3;ch++){
      const g00=grid[(y0*GN+x0)*3+ch],g10=grid[(y0*GN+x1)*3+ch];
      const g01=grid[(y1*GN+x0)*3+ch],g11=grid[(y1*GN+x1)*3+ch];
      out[ch]=(g00*(1-fx)+g10*fx)*(1-fy)+(g01*(1-fx)+g11*fx)*fy;
    }
    return out;
  };
  // 2) 归一化 + S 曲线对比
  for(let y=0;y<h;y++){
    const bg=bgAt(0,y);
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const b=bgAt(x,y);
      for(let ch=0;ch<3;ch++){
        let v=d[i+ch]/Math.max(50,b[ch])*255;
        v=(v-128)*1.18+128;          // 对比度
        v=v<120?v*0.82:v;             // 加深字迹
        d[i+ch]=Math.max(0,Math.min(255,v));
      }
    }
  }
  ctx.putImageData(img,0,0);
  return canvas;
}
function quadEdgeLengths(q,img){
  const dist=(a,b)=>Math.hypot((a.x-b.x)*img.width/100,(a.y-b.y)*img.height/100);
  const top=dist(q.pts[0],q.pts[1]),bottom=dist(q.pts[3],q.pts[2]);
  const left=dist(q.pts[0],q.pts[3]),right=dist(q.pts[1],q.pts[2]);
  return {w:Math.round(Math.max(top,bottom)),h:Math.round(Math.max(left,right))};
}
async function extractQuads(indexes){
  const w=state.work;
  const page=w.pages[w.cur];if(!page)return;
  const img=new Image();
  await new Promise(res=>{img.onload=res;img.src=page.src});
  let added=0;
  for(const i of indexes){
    const q=w.quads[i];if(!q)continue;
    const srcPts=q.pts.map(p=>({x:p.x*img.width/100,y:p.y*img.height/100}));
    const size=quadEdgeLengths(q,img);
    const outW=Math.max(40,Math.min(2400,size.w));
    const outH=Math.max(40,Math.min(3200,Math.round(outW*size.h/Math.max(1,size.w))));
    let cropped=warpPerspective(img,srcPts,outW,outH);
    if(state.settings.enhance!==false)cropped=enhanceImage(cropped);
    const full=cropped.toDataURL("image/jpeg",0.88);
    const tc=document.createElement("canvas");
    const ts=120/Math.max(cropped.width,cropped.height);
    tc.width=cropped.width*ts;tc.height=cropped.height*ts;
    tc.getContext("2d").drawImage(cropped,0,0,tc.width,tc.height);
    enqueueParse(full,tc.toDataURL("image/jpeg",0.7));
    added++;
  }
  return added;
}
async function extractAll(){
  const w=state.work;
  if(!w.quads.length){toast("请先框选题目区域","err");return}
  toast("正在裁剪与增强…");
  // 按拼接组分组：同组竖直拼接为一张
  const groups=new Map();
  const singles=[];
  w.quads.forEach((q,i)=>{
    if(q.group)groups.set(q.group,[...(groups.get(q.group)||[]),i]);
    else singles.push(i);
  });
  let added=0;
  for(const idx of singles){
    added+=await extractQuads([idx]);
  }
  for(const [,members] of groups){
    members.sort((a,b)=>{
      const ca=quadCenter(w.quads[a]),cb=quadCenter(w.quads[b]);
      return ca.y-cb.y||ca.x-cb.x;
    });
    const canvases=[];
    const img=new Image();
    await new Promise(res=>{img.onload=res;img.src=w.pages[w.cur].src});
    for(const i of members){
      const q=w.quads[i];
      const srcPts=q.pts.map(p=>({x:p.x*img.width/100,y:p.y*img.height/100}));
      const size=quadEdgeLengths(q,img);
      const outW=Math.max(40,Math.min(2400,size.w));
      const outH=Math.max(40,Math.min(3200,Math.round(outW*size.h/Math.max(1,size.w))));
      let c=warpPerspective(img,srcPts,outW,outH);
      if(state.settings.enhance!==false)c=enhanceImage(c);
      canvases.push(c);
    }
    const W=Math.max(...canvases.map(c=>c.width));
    const gap=14;
    const H=canvases.reduce((s,c)=>s+c.height,0)+gap*(canvases.length-1);
    const stitched=document.createElement("canvas");
    stitched.width=W;stitched.height=H;
    const sctx=stitched.getContext("2d");
    sctx.fillStyle="#fff";sctx.fillRect(0,0,W,H);
    let yy=0;
    for(const c of canvases){sctx.drawImage(c,0,yy);yy+=c.height+gap}
    const full=stitched.toDataURL("image/jpeg",0.88);
    const tc=document.createElement("canvas");
    const ts=120/Math.max(stitched.width,stitched.height);
    tc.width=stitched.width*ts;tc.height=stitched.height*ts;
    tc.getContext("2d").drawImage(stitched,0,0,tc.width,tc.height);
    enqueueParse(full,tc.toDataURL("image/jpeg",0.7));
    added++;
  }
  w.quads=[];w.stitchGroup=[];w.stitchMode=false;
  const wrap=$("#viewerWrap");if(wrap)drawQuads(wrap);
  updateExtractBtn();
  toast(`已提取 ${added} 道题进入解析队列`,"ok");
  renderNav();
}

/* ============================================================
 * 文件处理（图片 / PDF / 粘贴）
 * ============================================================ */
async function handleFiles(files){
  const arr=[...files];if(!arr.length)return;
  let n=0;
  for(const f of arr){
    if(f.type.startsWith("image/")){addPage(await fileToDataURL(f));n++}
    else if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
      const pages=await pdfToImages(f);
      pages.forEach(p=>addPage(p));n+=pages.length;
    }else toast(`不支持的文件：${f.name}`,"err");
  }
  if(n){
    toast(`已导入 ${n} 页`,"ok");
    if(state.route==="import")renderImport($("#view"));
  }
}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function pdfToImages(file){
  try{
    if(window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      const out=[];
      for(let i=1;i<=Math.min(pdf.numPages,20);i++){
        const page=await pdf.getPage(i);
        const vp=page.getViewport({scale:1.8});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
        await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        out.push(c.toDataURL("image/jpeg",0.88));
      }
      return out;
    }
    toast("PDF 组件未加载，请检查网络","err");return [];
  }catch(e){toast("PDF 解析失败："+e.message,"err");return []}
}
function addPage(src,thumb){
  state.work.pages.push({src,thumb:thumb||src});
  state.work.cur=state.work.pages.length-1;
  if(!thumb){
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");
      const s=160/Math.max(img.width,img.height);
      c.width=img.width*s;c.height=img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const target=state.work.pages.find(p=>p.src===src);
      if(target)target.thumb=c.toDataURL("image/jpeg",0.6);
      if(state.route==="import"&&$("#thumbStrip"))renderImport($("#view"));
    };
    img.src=src;
  }
}
document.addEventListener("paste",e=>{
  if(state.route!=="import")return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  const files=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);
  if(files.length){handleFiles(files);toast("已从剪贴板粘贴","ok")}
});
$("#fileInput").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value=""});

/* ============================================================
 * AI 解析队列
 * ============================================================ */
function enqueueParse(image,thumb){
  state.queue.push({id:uid(),image,thumb,status:"wait",mistakeId:null,error:""});
  processQueue();
}
let parsing=false;
async function processQueue(){
  if(parsing)return;
  const next=state.queue.find(q=>q.status==="wait");
  if(!next){parsing=false;renderQueue();return}
  parsing=true;next.status="doing";renderQueue();
  try{
    const result=await parseCrop(next.image);
    const m={
      id:uid(),subject:result.subject||state.settings.defaultSubject||"其他",
      topic:"",knowledge:result.knowledge||"",question:result.question||"",
      answer:result.answer||"",analysis:result.analysis||"",
      image:next.image,errorCount:1,mastered:false,
      createdAt:Date.now(),updatedAt:Date.now(),parsedBy:result.by||"manual"
    };
    await DB.put("mistakes",m);
    cloud.pushMistake(m);
    next.status="done";next.mistakeId=m.id;
    toast("解析完成，已存入错题库","ok");
  }catch(e){
    next.status="fail";next.error=e.message||"解析失败";
    toast("题目解析失败："+next.error,"err");
  }
  parsing=false;
  await loadAll();renderQueue();renderNav();
}
function renderQueue(){
  const list=$("#queueList");if(!list)return;
  if(!state.queue.length){
    list.innerHTML=`<div class="empty" style="padding:30px"><div class="empty-title">解析队列为空</div>提取选区后会加入这里</div>`;
    return;
  }
  list.innerHTML=[...state.queue].reverse().map(q=>`
    <div class="queue-item">
      <img class="queue-thumb" src="${q.thumb}">
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:700">${q.status==="done"?"已存入错题库":q.status==="fail"?esc(q.error):q.status==="doing"?"正在解析…":"等待中"}</div>
        ${q.status==="done"?`<a href="javascript:void(0)" data-view="${q.mistakeId}" style="font-size:12px">查看 →</a>`:""}
      </div>
      <span class="queue-status st-${q.status==="wait"?"wait":q.status==="doing"?"doing":q.status==="done"?"done":"fail"}">
        ${q.status==="wait"?"等待中":q.status==="doing"?"解析中":q.status==="done"?"已完成":"失败"}</span>
    </div>`).join("");
  $$("[data-view]").forEach(a=>a.onclick=()=>{loadAll().then(()=>openDetail(a.dataset.view))});
}
async function parseCrop(imageDataUrl){
  const s=state.settings;
  if(s.apiUrl&&s.apiKey)return parseViaAPI(imageDataUrl,s);
  await new Promise(r=>setTimeout(r,700+Math.random()*700));
  return {subject:state.settings.defaultSubject||"数学",knowledge:"",question:"",answer:"",analysis:"",by:"manual"};
}
async function parseViaAPI(imageDataUrl,s){
  const body={
    model:s.apiModel||"gpt-4o-mini",
    messages:[
      {role:"system",content:"你是错题整理助手。观察题目图片，输出 JSON（不要 markdown 代码块），字段：subject(学科，限：数学/语文/英语/物理/化学/生物/历史/地理/政治/其他)、knowledge(知识点，简短)、question(完整题干，数学公式用 LaTeX 写在 $ 中)、answer(正确答案)、analysis(分步解析，简洁清晰)。"},
      {role:"user",content:[
        {type:"text",text:"请解析这道题并按要求输出 JSON。"},
        {type:"image_url",image_url:{url:imageDataUrl}}
      ]}
    ],
    max_tokens:1200
  };
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),90000);
  let resp;
  try{
    resp=await fetch(s.apiUrl,{
      method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.apiKey},
      body:JSON.stringify(body)
    });
  }finally{clearTimeout(timer)}
  if(!resp.ok)throw new Error("接口返回 "+resp.status);
  const data=await resp.json();
  let text=(data.choices?.[0]?.message?.content||"").replace(/^```json\s*/,"").replace(/```$/,"").trim();
  const m=text.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("返回内容无法解析");
  const j=JSON.parse(m[0]);
  return {subject:SUBJECTS.includes(j.subject)?j.subject:"其他",
    knowledge:j.knowledge||"",question:j.question||"",answer:j.answer||"",analysis:j.analysis||"",by:"api"};
}

function condPool(){
  const c=state.composeCond;
  let pool=state.mistakes.slice();
  if(c.mastered==="未掌握")pool=pool.filter(m=>!m.mastered);
  if(c.mastered==="已掌握")pool=pool.filter(m=>m.mastered);
  if(c.subject!=="全部")pool=pool.filter(m=>m.subject===c.subject);
  if(c.errMin==="≥2次")pool=pool.filter(m=>(m.errorCount||1)>=2);
  if(c.errMin==="≥3次")pool=pool.filter(m=>(m.errorCount||1)>=3);
  if(c.kp.trim()){
    const k=c.kp.trim().toLowerCase();
    pool=pool.filter(m=>(m.knowledge||"").toLowerCase().includes(k));
  }
  if(c.range!=="全部"){
    const days={"近7天":7,"近1月":30,"近3月":90,"近6月":180}[c.range];
    if(days)pool=pool.filter(m=>m.createdAt>=Date.now()-days*864e5);
  }
  return pool;
}

 * ============================================================ */
function rangeStart(k){
  const now=new Date();
  if(k==="today"){const d=new Date(now);d.setHours(0,0,0,0);return d.getTime()}
  if(k==="week"){const d=new Date(now);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d.getTime()}
  if(k==="month"){return new Date(now.getFullYear(),now.getMonth(),1).getTime()}
  if(k==="7d")return Date.now()-7*864e5;
  if(k==="30d")return Date.now()-30*864e5;
  if(k==="term"){const m=now.getMonth();return (m>=8||m<2)?new Date(now.getFullYear(),8,1).getTime():new Date(now.getFullYear(),1,1).getTime()}
  return 0;
}
function renderHome(v){
  const ms=state.mistakes;
  const inRange=ms.filter(m=>m.createdAt>=rangeStart(state.statRange));
  const mastered=ms.filter(m=>m.mastered).length;
  const totalErr=ms.reduce((s,m)=>s+(m.errorCount||1),0);
  const bySubject={};ms.forEach(m=>bySubject[m.subject]=(bySubject[m.subject]||0)+1);
  const maxSub=Math.max(1,...Object.values(bySubject));
  const kpMap={};ms.forEach(m=>{const k=(m.knowledge||"").trim();if(k)kpMap[k]=(kpMap[k]||0)+(m.errorCount||1)});
  const topKp=Object.entries(kpMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const days=[];for(let i=6;i>=0;i--){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);
    const s=d.getTime(),e=s+864e5;
    days.push({label:`${d.getMonth()+1}/${d.getDate()}`,n:ms.filter(m=>m.createdAt>=s&&m.createdAt<e).length});
  }
  const maxDay=Math.max(1,...days.map(d=>d.n));
  const pts=days.map((d,i)=>`${(i/(days.length-1)*280+10).toFixed(1)},${(70-d.n/maxDay*58).toFixed(1)}`).join(" ");
  v.innerHTML=`
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    ${TIME_RANGES.map(t=>`<span class="chip ${state.statRange===t.k?"on":""}" data-r="${t.k}">${t.label}</span>`).join("")}
  </div>
  <div class="stat-grid">
    <div class="card stat-card"><div class="stat-icon" style="background:var(--accent-soft);color:var(--accent-deep)">${ICONS.book}</div>
      <div class="stat-value">${ms.length}</div><div class="stat-label">错题总数</div></div>
    <div class="card stat-card"><div class="stat-icon" style="background:var(--accent-soft);color:var(--accent-deep)">${ICONS.plus}</div>
      <div class="stat-value">${inRange.length}</div><div class="stat-label">时段内新增</div></div>
    <div class="card stat-card"><div class="stat-icon" style="background:var(--green-soft);color:#059669">${ICONS.check}</div>
      <div class="stat-value">${mastered}</div><div class="stat-label">已掌握</div></div>
    <div class="card stat-card"><div class="stat-icon" style="background:var(--red-soft);color:var(--red)">${ICONS.fire}</div>
      <div class="stat-value">${totalErr}</div><div class="stat-label">累计错误次数</div></div>
  </div>
  <div class="two-col">
    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="panel-title">科目分布 <span class="hint">按错题数量</span></div>
        <div style="padding:16px 20px 20px">
          ${Object.keys(bySubject).length?Object.entries(bySubject).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`
            <div class="bar-row"><span class="bar-label">${esc(s)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${n/maxSub*100}%"></div></div>
              <span class="bar-num">${n}</span></div>`).join("")
          :`<div class="empty" style="padding:26px"><div class="empty-title">暂无数据</div>上传错题后这里会显示科目分布</div>`}
        </div>
      </div>
      <div class="card">
        <div class="panel-title">最近 7 天新增趋势</div>
        <div style="padding:14px 20px 20px">
          <svg viewBox="0 0 300 92" style="width:100%;height:110px">
            <polyline points="${pts}" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            ${days.map((d,i)=>`<circle cx="${(i/(days.length-1)*280+10).toFixed(1)}" cy="${(70-d.n/maxDay*58).toFixed(1)}" r="3" fill="#0EA5E9"/>
              <text x="${(i/(days.length-1)*280+10).toFixed(1)}" y="88" text-anchor="middle" font-size="9" fill="#8AA6BA">${d.label}</text>`).join("")}
          </svg>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="panel-title">薄弱知识点 <span class="hint">按错误次数</span></div>
      <div style="padding:8px 20px 18px">
        ${topKp.length?topKp.map(([k,n],i)=>`<div class="kp-item">
          <span class="kp-rank ${i<3?"top":""}">${i+1}</span>
          <span style="flex:1;font-weight:700">${esc(k)}</span>
          <span style="font-size:12px;color:var(--ink3)">错 ${n} 次</span></div>`).join("")
        :`<div class="empty" style="padding:26px"><div class="empty-title">暂无数据</div>填写知识点后自动生成</div>`}
      </div>
    </div>
  </div>`;
  $$("#view .chip[data-r]").forEach(c=>c.onclick=()=>{state.statRange=c.dataset.r;renderHome(v)});
}

/* ============================================================
 * 设置
 * ============================================================ */
function renderSettings(v){
  const s=state.settings;
  const sizeMB=(state.mistakes.reduce((a,m)=>a+(m.image?m.image.length:0),0)/1048576).toFixed(1);
  v.innerHTML=`
  <div style="max-width:660px">
    <div class="card" style="padding:20px;margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;margin-bottom:4px">Supabase 云同步</div>
      <div style="font-size:12.5px;color:var(--ink3);margin-bottom:16px">
        填写项目 URL 与 anon key 后，错题与试卷自动同步云端。当前：${SUPA.on()?"✅ 已连接":"未配置"}</div>
      <div class="field"><label>项目 URL</label>
        <input class="input" id="supaUrl" value="${esc(s.supaUrl||"")}" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>Anon Key</label>
        <input class="input" id="supaKey" value="${esc(s.supaKey||"")}" placeholder="eyJhbGciOi..."></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" id="saveSupa">保存并测试连接</button>
        ${SUPA.on()?`<button class="btn btn-ghost" id="pullNow">立即拉取云端数据</button>`:""}
      </div>
    </div>
    <div class="card" style="padding:20px;margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;margin-bottom:4px">AI 解析配置</div>
      <div style="font-size:12.5px;color:var(--ink3);margin-bottom:16px">
        填写 OpenAI 兼容的多模态接口即可自动识题；未配置时提取后保留图片，可手动编辑补充。</div>
      <div class="field"><label>接口地址</label>
        <input class="input" id="setUrl" value="${esc(s.apiUrl)}" placeholder="https://api.openai.com/v1/chat/completions"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
        <div class="field"><label>API Key</label>
          <input class="input" id="setKey" type="password" value="${esc(s.apiKey)}" placeholder="sk-..."></div>
        <div class="field"><label>模型 <button style="font-size:11px;color:var(--accent);text-decoration:underline;margin-left:4px" id="fetchModels">获取列表</button></label>
          <input class="input" id="setModel" list="modelList" value="${esc(s.apiModel)}" placeholder="输入模型名或从列表选择">
          <datalist id="modelList">
            <option value="gpt-4o">
            <option value="gpt-4o-mini">
            <option value="gpt-4-vision-preview">
            <option value="gpt-4-turbo">
            <option value="claude-3.5-sonnet-20241022">
            <option value="claude-3-opus-20240229">
            <option value="qwen-vl-max">
            <option value="qwen-vl-plus">
            <option value="qwen-vl-max-latest">
            <option value="gemini-1.5-pro">
            <option value="gemini-1.5-flash">
            <option value="gemini-2.0-flash-exp">
            <option value="llama-3.2-90b-vision-preview">
            <option value="pixtral-12b-2409">
          </datalist>
          <div id="modelStatus" style="font-size:11px;color:var(--ink3);margin-top:4px"></div></div>
      </div>
      <div class="field"><label>默认科目</label>
        <select class="select" id="setSub">${SUBJECTS.map(x=>`<option ${s.defaultSubject===x?"selected":""}>${x}</option>`).join("")}</select></div>
      <button class="btn btn-primary" id="saveSet">保存配置</button>
    </div>
    <div class="card" style="padding:20px;margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;margin-bottom:4px">数据管理</div>
      <div style="font-size:12.5px;color:var(--ink3);margin-bottom:16px">
        错题 ${state.mistakes.length} 条 · 试卷 ${state.papers.length} 份 · 图片约 ${sizeMB} MB</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="expBtn">${ICONS.download} 导出数据</button>
        <button class="btn btn-ghost" id="impBtn">${ICONS.upload} 导入数据</button>
        <button class="btn btn-danger" id="clearBtn">${ICONS.trash} 清空全部数据</button>
      </div>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
    </div>
    <div class="card" style="padding:20px">
      <div style="font-size:15px;font-weight:800;margin-bottom:8px">关于</div>
      <div style="font-size:13px;color:var(--ink2);line-height:2">
        简错题 · AI 智能错题本 v4<br>
        内置相机 · 八点透视裁剪 · 拼接 · 扫描增强 · AI 解析 · 组卷打印 · 云同步。
      </div>
    </div>
  </div>`;
  $("#saveSupa").onclick=async()=>{
    state.settings.supaUrl=$("#supaUrl").value.trim();
    state.settings.supaKey=$("#supaKey").value.trim();
    await saveSettings();SUPA.url=state.settings.supaUrl;SUPA.key=state.settings.supaKey;
    syncFoot();
    if(SUPA.on()){
      try{
        const r=await supaFetch("mistakes?select=id&limit=1",{headers:{Prefer:"return=representation"}});
        if(r.ok){toast("云同步已连接","ok");await cloud.pull()}
      }catch(e){toast("连接失败："+e.message,"err")}
    }else toast("已保存","ok");
    renderSettings(v);
  };
  const pull=$("#pullNow");if(pull)pull.onclick=async()=>{await cloud.pull();renderView()};
  $("#saveSet").onclick=async()=>{
    state.settings.apiUrl=$("#setUrl").value.trim();
    state.settings.apiKey=$("#setKey").value.trim();
    state.settings.apiModel=$("#setModel").value.trim();
    state.settings.defaultSubject=$("#setSub").value;
    await saveSettings();toast("配置已保存","ok");
  };
  // 获取模型列表
  const fetchModelsBtn=$("#fetchModels");
  if(fetchModelsBtn){
    fetchModelsBtn.onclick=async()=>{
      const apiUrl=$("#setUrl").value.trim();
      const apiKey=$("#setKey").value.trim();
      if(!apiUrl||!apiKey){toast("请先填写 API 地址和 Key","err");return}
      const status=$("#modelStatus");
      status.textContent="正在获取...";
      fetchModelsBtn.disabled=true;
      try{
        // 尝试不同的模型列表端点
        const baseUrl=apiUrl.replace(/\/v1\/.*$/,"").replace(/\/$/,"");
        const endpoints=[
          `${baseUrl}/v1/models`,
          `${apiUrl.replace(/\/chat\/completions.*$/,"")}/models`,
          `${baseUrl}/models`
        ];
        let models=[];
        for(const endpoint of endpoints){
          try{
            const resp=await fetch(endpoint,{
              headers:{"Authorization":`Bearer ${apiKey}`,"Content-Type":"application/json"}
            });
            if(resp.ok){
              const data=await resp.json();
              models=data.data||data.models||data||[];
              if(Array.isArray(models)&&models.length>0)break;
            }
          }catch(e){continue}
        }
        if(models.length===0){
          status.textContent="未找到模型列表，请手动输入";
          status.style.color="var(--amber)";
        }else{
          status.textContent=`找到 ${models.length} 个模型`;
          status.style.color="var(--green)";
          const datalist=$("#modelList");
          if(datalist){
            datalist.innerHTML=models.map(m=>{
              const name=m.id||m.name||m;
              return `<option value="${esc(name)}">`;
            }).join("");
          }
        }
      }catch(e){
        status.textContent="获取失败："+e.message;
        status.style.color="var(--red)";
      }finally{
        fetchModelsBtn.disabled=false;
        setTimeout(()=>{status.textContent=""},5000);
      }
    };
  }
  $("#expBtn").onclick=()=>{
    const data={exportedAt:new Date().toISOString(),
      mistakes:state.mistakes,papers:state.papers.map(p=>({...p,pages:undefined}))};
    const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=`简错题备份-${fmtDate(Date.now())}.json`;a.click();
    URL.revokeObjectURL(a.href);toast("已导出","ok");
  };
  $("#impBtn").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const data=JSON.parse(await f.text());
      if(!Array.isArray(data.mistakes))throw new Error("文件格式不正确");
      if(!confirm(`将导入 ${data.mistakes.length} 条错题，继续吗？`))return;
      for(const m of data.mistakes){await DB.put("mistakes",m);cloud.pushMistake(m)}
      for(const p of data.papers||[]){await DB.put("papers",p);cloud.pushPaper(p)}
      await loadAll();toast("导入完成","ok");renderSettings(v);
    }catch(err){toast("导入失败："+err.message,"err")}
    e.target.value="";
  };
  $("#clearBtn").onclick=async()=>{
    if(!confirm("确定清空全部错题与试卷数据吗？不可恢复！"))return;
    if(!confirm("再次确认：清空后无法找回。"))return;
    await DB.clear("mistakes");await DB.clear("papers");
    state.composeSel.clear();state.queue=[];state.work={pages:[],cur:0,quads:[],stitchGroup:[],stitchMode:false};
    await loadAll();toast("已清空","ok");renderSettings(v);renderNav();
  };
}

/* ---------- 启动 ---------- */
(async function init(){
  try{
    await DB.open();
    await loadAll();
  }catch(e){
    toast("本地存储初始化失败："+e.message,"err");
  }
  syncFoot();
  const r=location.hash.replace(/^#\//,"")||"import";
  go(r in ROUTES?r:"import");
  if(SUPA.on())cloud.pull().then(()=>{syncFoot();renderView()});
})();
</script>
</body>
</html>
